name: Validate pre-Phase 4 stabilization

on:
  push:
    branches: [codex/estabiliza-pre-fase4]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase and verify all migrations
        run: |
          npx supabase start
          npx supabase db reset --local
          npx supabase migration list --local
          npx supabase db push --dry-run --local
      - name: Serve institutional invitations locally
        run: npx supabase functions serve institutional-invite > /tmp/aprende-functions.log 2>&1 &
      - name: Run all tests with the disposable database
        run: |
          eval "$(npx supabase status -o env)"
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/institutional-invite/index.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:pages
      - name: Run local security advisors
        run: npx supabase db advisors --local --type security --level error --fail-on error
      - name: Report dependency audit without accepting critical findings
        run: npm audit --audit-level=critical
      - name: Stop disposable Supabase
        if: always()
        run: npx supabase stop --no-backup
