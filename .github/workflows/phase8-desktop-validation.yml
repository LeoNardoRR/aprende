name: Validate Phase 8 desktop

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase and apply every migration
        run: |
          set -o pipefail
          npx supabase start
          npx supabase db reset --local
          npx supabase migration list --local | tee /tmp/phase8-migrations.log
          npx supabase db push --dry-run --local
      - name: Seed synthetic data twice
        run: |
          set -o pipefail
          eval "$(npx supabase status -o env)"
          for attempt in {1..30}; do
            if curl --fail --silent "$API_URL/auth/v1/health" >/dev/null \
              && curl --fail --silent --header "apikey: $ANON_KEY" "$API_URL/rest/v1/" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$API_URL/auth/v1/health" >/dev/null
          curl --fail --silent --header "apikey: $ANON_KEY" "$API_URL/rest/v1/" >/dev/null
          for run in 1 2; do
            for attempt in 1 2 3; do
              if SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run seed:poc; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 3
            done
            SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run seed:phase7
          done | tee /tmp/phase8-seed.log
      - name: Serve Edge Functions
        run: npx supabase functions serve > /tmp/phase8-functions.log 2>&1 &
      - name: Run all connected regressions
        run: |
          set -o pipefail
          eval "$(npx supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" PHASE5_LOAD_TEST=1 npm test | tee /tmp/phase8-regression.log
          test "$(awk '/# skipped / { print $3 }' /tmp/phase8-regression.log | tail -1)" = "0"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:poc
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:phase7
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:phase8 | tee /tmp/phase8-tests.log
          test "$(awk '/# skipped / { print $3 }' /tmp/phase8-tests.log | tail -1)" = "0"
      - name: Validate PoC and smoke
        run: |
          set -o pipefail
          eval "$(npx supabase status -o env)"
          npm run poc:matrix
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run poc:smoke
      - name: Run desktop Playwright journeys
        run: |
          set -o pipefail
          eval "$(npx supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run test:e2e
      - name: Measure 12,849 synthetic students across 33 schools
        run: |
          set -o pipefail
          eval "$(npx supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" DB_URL="$DB_URL" npm run phase7:performance
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate application and Edge Functions
        run: |
          deno check supabase/functions/institutional-invite/index.ts
          deno check supabase/functions/analytics-report-worker/index.ts
          npm run lint
          npm run typecheck
          npm run build
          npm run build:pages
      - name: Run database advisors
        run: |
          set -o pipefail
          mkdir -p artifacts/phase8
          npx supabase db advisors --local --type all --level info --fail-on error | tee artifacts/phase8/advisors.log
      - name: Audit dependencies
        run: npm audit --audit-level=high --json > artifacts/phase8/npm-audit.json
      - name: Restore synthetic application data in the disposable database
        run: |
          set -o pipefail
          eval "$(npx supabase status -o env)"
          case "$DB_URL" in *127.0.0.1*|*localhost*) ;; *) echo "Refusing non-local restore"; exit 1;; esac
          DB_CONTAINER="$(docker ps --filter 'name=^supabase_db_aprende$' --format '{{.Names}}')"
          test "$DB_CONTAINER" = "supabase_db_aprende"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -At \
            -c "select (select count(*) from public.profiles)||','||(select count(*) from public.networks)||','||(select count(*) from public.institutional_memberships)" \
            > /tmp/phase8-counts-before.txt
          docker exec "$DB_CONTAINER" pg_dump -U postgres -d postgres --data-only --schema=public \
            --exclude-table=public.spatial_ref_sys --format=custom --no-owner --no-privileges \
            > /tmp/phase8-backup.dump
          docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "do \$\$ declare statement text; begin select 'truncate table '||string_agg(format('%I.%I',schemaname,tablename),', ')||' cascade' into statement from pg_tables where schemaname='public' and tablename<>'spatial_ref_sys'; execute statement; end \$\$;"
          docker exec -i "$DB_CONTAINER" pg_restore -U supabase_admin -d postgres --data-only \
            --disable-triggers --no-owner --no-privileges < /tmp/phase8-backup.dump
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
            -c "select (select count(*) from public.profiles)||','||(select count(*) from public.networks)||','||(select count(*) from public.institutional_memberships)" \
            | tee /tmp/phase8-counts-after.txt
          diff -u /tmp/phase8-counts-before.txt /tmp/phase8-counts-after.txt | tee /tmp/phase8-restore.log
      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p artifacts/phase8/logs
          find /tmp -maxdepth 1 -name 'phase8-*.log' -exec cp {} artifacts/phase8/logs/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase8-desktop-validation-evidence
          path: |
            artifacts/phase8
            test-results
            playwright-report
          retention-days: 7
      - name: Stop disposable Supabase
        if: always()
        run: npx supabase stop --no-backup
